name: Windows native candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run build
      - run: bun run test -- test/windows/ test/executable.test.ts test/resolve-command-shell-parse.test.ts test/pty-backend-launch-shell.test.ts test/log-tail.test.ts test/autostart-standalone-path.test.ts
      - run: node windows/build.mjs --skip-build
      - run: tar -czf windows-native.tgz -C build/windows-native .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native
          path: windows-native.tgz
  verify:
    needs: build
    runs-on: windows-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-native
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - shell: pwsh
        run: |
          New-Item -ItemType Directory 'candidate with spaces'
          tar -xzf windows-native.tgz -C 'candidate with spaces'
          node 'candidate with spaces/windows/manage.mjs' install 'candidate with spaces' --root "$env:RUNNER_TEMP/BotMux installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/BotMux installed/bin/botmux.cmd" --version
